services:
  - type: web
    name: esp32-iot-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: API_KEY
        generateValue: true   # Render tự sinh key ngẫu nhiên, xem trong tab Environment
      - key: OFFLINE_TIMEOUT_SECONDS
        value: "15"
      - key: REFRESH_INTERVAL_SECONDS
        value: "3"
